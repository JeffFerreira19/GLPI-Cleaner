# Incluir DENTRO do bloco server { } existente (não criar outro server fora de http { })
# Painel: http://SEU-SERVIDOR/cleaner/   (a barra final é obrigatória)
location = /cleaner { return 301 /cleaner/; }

location /cleaner/ {
    proxy_pass         http://127.0.0.1:3910/;
    proxy_http_version 1.1;
    proxy_set_header   Host $host;
    proxy_set_header   X-Real-IP $remote_addr;
    proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 300s;
}
